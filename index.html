<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Journey</title>
<style>
:root {
  --bg: #FBF8F4;
  --card-bg: #FFFFFF;
  --card-locked: #F5F0EA;
  --accent: #B97A6E;
  --accent-light: #F5E8E6;
  --text: #2C2420;
  --text-muted: #9A8880;
  --border: #E8DDD8;
  --gold: #C9983A;
  --dark: #1E1A18;
}
 
* { box-sizing: border-box; margin: 0; padding: 0; }
 
body {
  background: var(--bg);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Georgia, sans-serif;
  color: var(--text);
  min-height: 100vh;
  padding: 2.5rem 1rem 4rem;
}
 
/* ─── Header ─── */
.header {
  text-align: center;
  margin-bottom: 2.5rem;
  max-width: 560px;
  margin-left: auto;
  margin-right: auto;
}
 
.header-eyebrow {
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.15em;
  color: var(--text-muted);
  margin-bottom: 0.6rem;
}
 
.header h1 {
  font-size: 2rem;
  font-weight: 400;
  letter-spacing: 0.03em;
  color: var(--text);
  margin-bottom: 0.4rem;
}
 
.header-tagline {
  font-size: 0.875rem;
  color: var(--text-muted);
  margin-bottom: 1.75rem;
  font-style: italic;
}
 
.progress-wrap {
  background: var(--border);
  height: 2px;
  border-radius: 99px;
  overflow: hidden;
  max-width: 280px;
  margin: 0 auto 0.5rem;
}
 
.progress-fill {
  height: 100%;
  background: var(--accent);
  border-radius: 99px;
  transition: width 0.6s cubic-bezier(0.4,0,0.2,1);
}
 
.progress-text {
  font-size: 0.72rem;
  color: var(--text-muted);
  letter-spacing: 0.06em;
}
 
/* ─── Grid ─── */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 1rem;
  max-width: 820px;
  margin: 0 auto 3rem;
}
 
/* ─── Card base ─── */
.card {
  border-radius: 18px;
  padding: 1.4rem 1.25rem;
  position: relative;
  overflow: hidden;
  transition: transform 0.2s;
}
 
.card:hover { transform: translateY(-2px); }
 
.card.locked {
  background: var(--card-locked);
  border: 1px solid var(--border);
}
 
.card.unlocked {
  background: var(--card-bg);
  border: 1px solid #E2D4D0;
}
 
.card.final-unlocked {
  border: 1.5px solid var(--gold);
  background: #FFFDF7;
}
 
/* shine sweep on unlock */
@keyframes sweep {
  0%   { left: -80%; opacity: 0.6; }
  100% { left: 160%; opacity: 0; }
}
.card.sweeping::after {
  content: '';
  position: absolute;
  top: 0; left: -80%;
  width: 60%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.55), transparent);
  animation: sweep 0.55s ease-out;
  pointer-events: none;
}
 
/* ─── Card internals ─── */
.card-eyebrow {
  font-size: 0.65rem;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--text-muted);
  margin-bottom: 0.5rem;
}
 
.card-emoji {
  font-size: 1.35rem;
  margin-bottom: 0.4rem;
  display: block;
}
 
.card-theme {
  font-size: 1rem;
  font-weight: 500;
  color: var(--text);
  margin-bottom: 0.6rem;
}
 
.card-message {
  font-size: 0.83rem;
  color: var(--text-muted);
  line-height: 1.65;
  font-style: italic;
}
 
.unlocked-tag {
  display: inline-block;
  margin-top: 0.8rem;
  font-size: 0.65rem;
  padding: 3px 9px;
  border-radius: 99px;
  background: var(--accent-light);
  color: var(--accent);
  font-weight: 500;
  letter-spacing: 0.05em;
}
 
.final-tag {
  background: #FEF3D8;
  color: var(--gold);
}
 
/* ─── Code form ─── */
.lock-icon {
  font-size: 1.4rem;
  opacity: 0.3;
  margin-bottom: 0.6rem;
  display: block;
}
 
.locked-theme {
  font-size: 0.88rem;
  color: var(--text-muted);
  margin-bottom: 0.6rem;
}
 
.hint-text {
  font-size: 0.75rem;
  color: var(--text-muted);
  margin-bottom: 0.75rem;
}
 
.code-form {
  display: flex;
  gap: 6px;
}
 
.code-input {
  flex: 1;
  padding: 7px 10px;
  border: 1px solid var(--border);
  border-radius: 9px;
  font-size: 0.85rem;
  background: var(--bg);
  color: var(--text);
  outline: none;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  transition: border-color 0.15s;
  min-width: 0;
}
 
.code-input:focus { border-color: var(--accent); }
.code-input.error  { border-color: #C4595A; }
 
.code-btn {
  padding: 7px 14px;
  background: var(--accent);
  color: white;
  border: none;
  border-radius: 9px;
  font-size: 0.8rem;
  cursor: pointer;
  font-weight: 500;
  white-space: nowrap;
  flex-shrink: 0;
  transition: opacity 0.15s;
}
 
.code-btn:hover { opacity: 0.85; }
 
.wrong-msg {
  font-size: 0.72rem;
  color: #C4595A;
  margin-top: 5px;
  min-height: 1.1em;
}
 
/* ─── Grand Reveal ─── */
.reveal-section {
  max-width: 580px;
  margin: 0 auto;
  text-align: center;
  padding: 3rem 2rem;
  background: var(--dark);
  border-radius: 24px;
  color: white;
  display: none;
}
 
.reveal-section.visible {
  display: block;
  animation: fadeUp 0.9s ease both;
}
 
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(24px); }
  to   { opacity: 1; transform: translateY(0); }
}
 
.reveal-eyebrow {
  font-size: 0.65rem;
  text-transform: uppercase;
  letter-spacing: 0.18em;
  opacity: 0.45;
  margin-bottom: 0.75rem;
}
 
.reveal-title {
  font-size: 1.9rem;
  font-weight: 300;
  letter-spacing: 0.04em;
  margin-bottom: 0.3rem;
}
 
.reveal-divider {
  width: 40px;
  height: 1px;
  background: rgba(255,255,255,0.2);
  margin: 1.25rem auto;
}
 
.reveal-message {
  font-size: 0.95rem;
  line-height: 1.85;
  opacity: 0.8;
  font-style: italic;
  margin-bottom: 2rem;
  padding: 0 0.5rem;
}
 
.reveal-gift-box {
  background: rgba(255,255,255,0.07);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 14px;
  padding: 1.25rem 1.5rem;
}
 
.reveal-gift-label {
  font-size: 0.65rem;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  opacity: 0.4;
  margin-bottom: 0.6rem;
}
 
.reveal-gift-text {
  font-size: 0.9rem;
  line-height: 1.7;
  opacity: 0.9;
}
 
/* ─── Confetti ─── */
.confetti-piece {
  position: fixed;
  width: 8px;
  height: 8px;
  border-radius: 1px;
  pointer-events: none;
  animation: fall linear forwards;
}
 
@keyframes fall {
  0%   { transform: translateY(-10px) rotate(0deg); opacity: 1; }
  100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
}
</style>
</head>
<body>

<!-- ================================================================
     END CUSTOMIZATION — don't edit below unless you're comfortable
================================================================ -->
 
<div class="header">
  <div class="header-eyebrow">12 Months of us</div>
  <h1 id="pageTitle"></h1>
  <div class="header-tagline" id="pageTagline"></div>
  <div class="progress-wrap">
    <div class="progress-fill" id="progressFill" style="width:0%"></div>
  </div>
  <div class="progress-text" id="progressText">0 of 11 unlocked</div>
</div>
 
<div class="grid" id="cardGrid"></div>
 
<div class="reveal-section" id="revealSection">
  <div class="reveal-eyebrow">the surprise</div>
  <div class="reveal-title" id="revealTitle"></div>
  <div class="reveal-divider"></div>
  <div class="reveal-message" id="revealMsg"></div>
  <div class="reveal-gift-box">
    <div class="reveal-gift-label">Your surprise</div>
    <div class="reveal-gift-text" id="revealGift"></div>
  </div>
</div>
 
<script>
const STORE = 'new02';
let unlocked = JSON.parse(localStorage.getItem(STORE) || '[]');
 
// Fill header
document.getElementById('pageTitle').textContent   = CONFIG.title;
document.getElementById('pageTagline').textContent = CONFIG.tagline;
 
// ─── Build a single card ───
function buildCard(m, idx) {
  const card = document.createElement('div');
  const isUnlocked = unlocked.includes(idx);
  card.id = 'card-' + idx;
  card.className = 'card ' + (isUnlocked ? (m.final ? 'unlocked final-unlocked' : 'unlocked') : 'locked');
 
  if (isUnlocked) {
    card.innerHTML = `
      <div class="card-eyebrow">Month ${m.num}</div>
      <span class="card-emoji">${m.emoji}</span>
      <div class="card-theme">${m.theme}</div>
      <div class="card-message">${m.message}</div>
      <span class="unlocked-tag ${m.final ? 'final-tag' : ''}">
        ${m.final ? '★ All unlocked' : 'Unlocked ✓'}
      </span>`;
  } else {
    card.innerHTML = `
      <div class="card-eyebrow">Month ${m.num}</div>
      <span class="lock-icon">🔒</span>
      <div class="locked-theme">${m.theme}</div>
      <div class="hint-text">Enter this month's code</div>
      <div class="code-form">
        <input class="code-input" id="inp-${idx}" type="text" maxlength="12"
               placeholder="CODE" autocomplete="off" spellcheck="false" />
        <button class="code-btn" onclick="tryUnlock(${idx})">Open</button>
      </div>
      <div class="wrong-msg" id="err-${idx}"></div>`;
 
    // Enter key support
    requestAnimationFrame(() => {
      const inp = document.getElementById('inp-' + idx);
      if (inp) inp.addEventListener('keydown', e => { if (e.key === 'Enter') tryUnlock(idx); });
    });
  }
  return card;
}
 
// ─── Attempt unlock ───
function tryUnlock(idx) {
  const m     = CONFIG.months[idx];
  const inp   = document.getElementById('inp-' + idx);
  const err   = document.getElementById('err-' + idx);
  const val   = inp.value.trim().toUpperCase();
  const key   = m.code.toUpperCase();
 
  if (val === key) {
    unlocked.push(idx);
    localStorage.setItem(STORE, JSON.stringify(unlocked));
 
    const old = document.getElementById('card-' + idx);
    const newCard = buildCard(m, idx);
    newCard.classList.add('sweeping');
    document.getElementById('cardGrid').replaceChild(newCard, old);
    setTimeout(() => newCard.classList.remove('sweeping'), 700);
 
    updateProgress();
    if (unlocked.length === CONFIG.months.length) fireConfetti();
 
  } else {
    err.textContent = 'Not quite — try again.';
    inp.classList.add('error');
    setTimeout(() => {
      err.textContent = '';
      inp.classList.remove('error');
    }, 2200);
  }
}
 
// ─── Progress bar + reveal ───
function updateProgress() {
  const total = CONFIG.months.length;
  const count = unlocked.length;
  document.getElementById('progressFill').style.width = (count / total * 100) + '%';
  document.getElementById('progressText').textContent = `${count} of ${total} unlocked`;
 
  if (count === total) {
    const sec = document.getElementById('revealSection');
    document.getElementById('revealTitle').textContent = CONFIG.reveal.title;
    document.getElementById('revealMsg').textContent   = CONFIG.reveal.message;
    document.getElementById('revealGift').textContent  = CONFIG.reveal.giftText;
    sec.classList.add('visible');
    setTimeout(() => sec.scrollIntoView({ behavior: 'smooth', block: 'center' }), 300);
  }
}
 
// ─── Confetti burst ───
function fireConfetti() {
  const colors = ['#B97A6E','#C9983A','#8B9E7A','#7A8BAE','#C4A0A0'];
  for (let i = 0; i < 55; i++) {
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    el.style.cssText = `
      left: ${Math.random() * 100}vw;
      top: 0;
      background: ${colors[Math.floor(Math.random() * colors.length)]};
      border-radius: ${Math.random() > 0.5 ? '50%' : '1px'};
      animation-duration: ${1.5 + Math.random() * 1.5}s;
      animation-delay: ${Math.random() * 0.8}s;
    `;
    document.body.appendChild(el);
    el.addEventListener('animationend', () => el.remove());
  }
}
 
// ─── Initial render ───
const grid = document.getElementById('cardGrid');
CONFIG.months.forEach((m, i) => grid.appendChild(buildCard(m, i)));
updateProgress();
</script>
</body>
</html>
